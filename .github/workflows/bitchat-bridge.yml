name: Bitchat bridge

# Tests on every push that touches the bridge. On main, the boards of tools/bitchat/main_targets.txt
# are built, each also with the Brasil radio; a manual run with scope "all" builds every bridge
# environment and every country of tools/bitchat/regions.json. A release is published when the head
# commit message contains [publish-release] or the manual run asks for it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version named in variants/bitchat/platformio.ini
        type: boolean
        default: false
      scope:
        description: "main: the boards in tools/bitchat/main_targets.txt, Brasil package; all: every board and country"
        type: choice
        options:
          - main
          - all
        default: main
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'src/**'
      - 'examples/companion_radio/**'
      - 'variants/**'
      - 'test/bitchat/**'
      - 'tools/bitchat/**'
      - 'docs/bitchat/RELEASE.md'
      - 'platformio.ini'
      - '.github/workflows/bitchat-bridge.yml'

concurrency:
  group: bitchat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REFERENCE_ENV: Heltec_v3_companion_radio_ble_bitchat
  STOCK_ENV: Heltec_v3_companion_radio_ble

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      regions: ${{ steps.targets.outputs.regions }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Init Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-bitchat

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Environments are up to date
        run: |
          python tools/bitchat/generate_envs.py
          git diff --exit-code -- variants/bitchat/platformio.ini

      - name: Host tests
        run: |
          set -o pipefail
          pio pkg install -e "$REFERENCE_ENV" 2>&1 | tail -5
          python tools/bitchat/run_tests.py --crypto-dir ".pio/libdeps/$REFERENCE_ENV/Crypto" 2>&1 | tee tests.log

      - name: Build stock companion (bridge flag absent)
        run: |
          set -o pipefail
          pio run -e "$STOCK_ENV" 2>&1 | tee stock.log | tail -15

      - name: Summary
        if: always()
        run: |
          for log in tests.log stock.log; do
            [ -f "$log" ] || continue
            grep -E "PASS|^RAM:|^Flash:|SUCCESS" "$log" | head -5 | while IFS= read -r line; do echo "::notice title=$log::$line"; done
            grep -E "error:|Error [0-9]|undefined reference|^FAIL|did not compile|failed$" "$log" | head -8 | while IFS= read -r line; do echo "::error title=$log::$line"; done
          done

      - name: Targets
        id: targets
        run: |
          regions="brasil"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            list=$(grep -oP '(?<=^\[env:)[^\]]+' variants/bitchat/platformio.ini)
            regions=$(python3 -c "import json; print(' '.join(json.load(open('tools/bitchat/regions.json'))))")
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list=$(grep -v '^#' tools/bitchat/main_targets.txt | sed '/^$/d')
            for env in $list; do
              grep -q "^\[env:$env\]" variants/bitchat/platformio.ini || { echo "::error::$env is not in variants/bitchat/platformio.ini"; exit 1; }
            done
          else
            list="$REFERENCE_ENV"
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "targets=$(echo "$list" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -oP "FIRMWARE_VERSION='\"\K[^\"]+" variants/bitchat/platformio.ini | head -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.verify.outputs.targets) }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Init Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-bitchat

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: |
          set -o pipefail
          pio run -e "${{ matrix.environment }}" 2>&1 | tee build.log | tail -30

      - name: Summary
        if: always()
        run: |
          grep -E "^RAM:|^Flash:" build.log | head -2 | while IFS= read -r line; do echo "::notice title=${{ matrix.environment }}::$line"; done
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -8 | while IFS= read -r line; do echo "::error title=${{ matrix.environment }}::$line"; done

      - name: Collect firmware
        run: tools/bitchat/collect_firmware.sh "${{ matrix.environment }}" firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware/

      # The same environment again for each country asked (Brasil, or every country of
      # tools/bitchat/regions.json): only the radio a never-configured device starts with changes.
      - name: Build for each country
        run: |
          set -o pipefail
          for region in ${{ needs.verify.outputs.regions }}; do
            export BITCHAT_REGION="$region"
            pio run -e "${{ matrix.environment }}" 2>&1 | tee "build-$region.log" | grep -E "Bridge: factory radio|^RAM:|^Flash:|SUCCESS|FAILED|error:"
            tools/bitchat/collect_firmware.sh "${{ matrix.environment }}" "countries/$region"
          done

      - name: Upload country firmware
        uses: actions/upload-artifact@v4
        with:
          name: country-${{ matrix.environment }}
          path: countries/

  release:
    needs: [verify, build]
    # One board that fails to build does not hold back the others; its files are simply absent.
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[publish-release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: published
          merge-multiple: true

      - name: Download country firmware
        uses: actions/download-artifact@v4
        with:
          pattern: country-*
          path: countries
          merge-multiple: true

      - name: One package per country
        run: python3 tools/bitchat/pack_regions.py countries published "${{ needs.verify.outputs.version }}"

      - name: Checksums
        run: |
          cd published
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
          ls | wc -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          gh release create "$version" published/* --target "$GITHUB_SHA" --prerelease \
            --title "MeshCore + Bitchat $version" --notes-file docs/bitchat/RELEASE.md

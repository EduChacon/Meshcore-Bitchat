; LilyGo T-Deck and T-Deck Plus with the keyboard chat UI of the Cardputer build. The board is the
; stock variants/lilygo_tdeck; this folder adds a display that shows the UI's 240x135 frame enlarged
; and a stand-in for the Cardputer library that reads the T-Deck's keyboard and trackball.

[env:LilyGo_TDeck_keyboard_companion_radio_ble]
extends = LilyGo_TDeck
build_unflags =
  -D DISPLAY_CLASS=ST7789LCDDisplay
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I variants/lilygo_tdeck_keyboard
  -I examples/companion_radio/ui-keyboard
  -D TDECK_KEYBOARD_UI=1
  -D DISPLAY_CLASS=TDeckCardDisplay
  -D HEADLESS_UI=1
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=30
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  -<helpers/ui/ST7789LCDDisplay.cpp>
  +<../variants/lilygo_tdeck_keyboard>
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-keyboard/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0
  yoprogramo/QRcodeDisplay @ ^2.1.0

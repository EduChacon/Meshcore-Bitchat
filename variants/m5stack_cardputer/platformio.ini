; M5Stack Cardputer-Adv with the Cap LoRa-1262 (SX1262, GPS). Board support and the keyboard UI come
; from the MeshCore-Cardputer-ADV project by Stachu (MIT), adapted to this MeshCore version.

[m5stack_cardputer_base]
extends = esp32_base
board = m5stack_cardputer
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/m5stack_cardputer
  -D M5STACK_CARDPUTER
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM=1
  -D PIN_USER_BTN=0
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_MOSI=14
  -D P_LORA_MISO=39
  -D P_LORA_SCLK=40
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=240
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  -D PIN_VBAT_READ=10
  -D GPS_RX_PIN=15
  -D GPS_TX_PIN=13
  -D HAS_GPS=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack_cardputer>
lib_deps =
  ${esp32_base.lib_deps}
  M5Cardputer=https://github.com/m5stack/M5Cardputer
  stevemarple/MicroNMEA @ ^2.0.6

[env:M5Stack_Cardputer_ADV_companion_radio_ble]
extends = m5stack_cardputer_base
build_flags =
  ${m5stack_cardputer_base.build_flags}
  -I examples/companion_radio/ui-keyboard
  -D DISPLAY_CLASS=M5CardputerDisplay
  -D HEADLESS_UI=1
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=30
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter = ${m5stack_cardputer_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/M5CardputerDisplay.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-keyboard/*.cpp>
lib_deps =
  ${m5stack_cardputer_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  yoprogramo/QRcodeDisplay @ ^2.1.0
